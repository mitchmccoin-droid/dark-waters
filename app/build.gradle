plugins { id 'com.android.application' }
android {
    compileSdkVersion 34
    defaultConfig {
        applicationId "com.darkwaters.sentinel"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    aaptOptions { noCompress "html","js","css","png","jpg","webp" }
    packagingOptions { doNotStrip "**/*.html" }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }