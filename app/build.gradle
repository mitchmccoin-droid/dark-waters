plugins { id 'com.android.application' }
android {
    namespace "com.darkwaters.sentinel"
    compileSdk 34
    defaultConfig {
        applicationId "com.darkwaters.sentinel"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes { release { minifyEnabled false } }
    aaptOptions { noCompress "html","js","css","png","jpg","webp" }
    packagingOptions { doNotStrip "**/*.html" }
}
dependencies {}
